{% extends 'base.html' %} 

{% block Skeleton %} 
<div id="layoutAuthentication" class="bg-primary d-flex flex-column min-vh-100"> 
    <div id="layoutAuthentication_content" class="flex-grow-1 d-flex align-items-center"> 
        <div class="container my-5"> 
            <div class="row justify-content-center"> 
                <div class="col-lg-5"> 
                    <div class="card shadow-lg border-0 rounded-lg"> 
                        <div class="card-header bg-dark">
                            <h3 class="text-center font-weight-light my-4 text-primary">Login</h3>
                        </div> 
                        <div class="card-body"> 
                            <form action="{{ url('/Adm/Login') }}" method="post"> 
                                <div class="form-floating mb-3"> 
                                    <input class="form-control" id="inputEmail" type="email" placeholder="fulano@gmail.com" name="email"/> 
                                    <label for="inputEmail">E-mail</label> 
                                </div> 
                                <div class="form-floating mb-3"> 
                                    <input class="form-control" id="inputPassword" type="password" placeholder="Senha" name="password"/> 
                                    <label for="inputPassword">Senha</label> 
                                </div> 
                                <div class="d-flex align-items-center flex-column gap-3"> 
                                    <input class="btn btn-primary btn-lg" type="submit" value="Entrar"> 
                                </div> 
                            </form> 
                        </div> 
                    </div> 
                </div> 
            </div> 
        </div> 
    </div> 
    <div id="layoutAuthentication_footer"> 
        <footer class="py-4 bg-light"> 
            <div class="container-fluid px-4"> 
                <div class="d-flex align-items-center justify-content-between small"> 
                    <div class="text-muted">&copy; {{ "now"|date("Y") }} - {{ constant('WEBSITE') }}</div> 
                    <div> 
                        <a href="#">Privacy Policy</a> 
                        &middot; 
                        <a href="#">Terms &amp; Conditions</a> 
                    </div> 
                </div> 
            </div> 
        </footer> 
    </div> 
</div> 
{% endblock %}
