{% extends 'base.html' %}
{% block Base %}
<div class="container py-4">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb bg-white">
            <li class="breadcrumb-item"><a href="{{url()}}">Início</a></li>
            <li class="breadcrumb-item"><a href="{{ url('/ViewArticlesByCategory/')  ~ (article.category|url_encode) }}">{{ article.category }}</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ article.title }}</li>
        </ol>
    </nav>

  <!-- Cabeçalho do Artigo -->
  <div class="row text-center mb-4">
    <!-- Título acima -->
    <div class="col-12 mb-3 bg-white">
      <h1 class="display-4 fw-bold">{{ article.title }}</h1>
    </div>

    <!-- Categoria e Data na mesma linha (alinhados horizontalmente) -->
    <div class="col-12 bg-white">
      <div class="row justify-content-center text-muted">
        <div class="col-auto">
          <h6><strong>Categoria:</strong> {{ article.category }}</h6>
        </div>
        <div class="col-auto">
          <span>•</span>
        </div>
        <div class="col-auto">
          <h6><strong>Publicado em:</strong> {{ article.publication_date }}</h6>
        </div>
      </div>
    </div>
  </div>

  <!-- Imagem Destaque (Ocupando maior espaço) -->
  <div class="row justify-content-center mb-4">
    <div class="col-12 col-lg-10 text-center">
      <img src="{{ article.image }}" alt="{{ article.title }}" class="img-fluid rounded shadow-sm w-100">
    </div>
  </div>

  <!-- Conteúdo do Artigo -->
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10">
      <div class="article-body fs-5 lh-lg bg-light">
        {{ article.content }}
      </div>
    </div>
  </div>

</div>
{% endblock %}
